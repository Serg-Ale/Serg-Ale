<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1272 436" role="img" aria-label="Path: school with Alura and Java, 2022 intern at TCS, 2023 analyst at TCS, 2024 junior at Aeon Tech, 2026 mid-level at Aeon Tech and partner developer at Kaizen."><rect x="0.5" y="0.5" width="1271" height="435" rx="20" fill="#141417" stroke="#26262B"/><g transform="translate(36,36)"><text x="0" y="30" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#EDEDED">I like understanding how technology works underneath. It is the closest thing to magic we have: with a</text><text x="0" y="60" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#EDEDED">computer and an idea, I can change what is around me.</text><line x1="0" y1="114" x2="1200" y2="114" stroke="#26262B" stroke-width="2"/><circle cx="8" cy="114" r="8" fill="#0D0D0F" stroke="#FF6B35" stroke-width="3"/><text x="0" y="156" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="14" letter-spacing="2" fill="#FF6B35">School</text><text x="0" y="188" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#EDEDED">Alura</text><text x="0" y="220" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">The state of Paraná gave</text><text x="0" y="242" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">students access to</text><text x="0" y="264" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">Alura. I started with</text><text x="0" y="286" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">Java, mostly because of</text><text x="0" y="308" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">Minecraft.</text><circle cx="248" cy="114" r="8" fill="#0D0D0F" str