<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 634" role="img" aria-label="How I work, speak-driven development: I talk, Claude asks, and the spec comes out of the conversation. Grill the plan, write the spec, cut the tickets, test first, review in a clean context."><rect x="0.5" y="0.5" width="1199" height="633" rx="20" fill="#141417" stroke="#26262B"/><text x="44" y="70" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="36" font-weight="800" fill="#EDEDED"><tspan fill="#FF6B35">Speak</tspan>-driven development.</text><text x="44" y="108" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8A8A8A">I talk, Claude asks, and the spec comes out of the</text><text x="44" y="134" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8A8A8A">conversation. It is not prompt engineering.</text><circle cx="790" cy="70" r="30" fill="#FF6B35"/><circle cx="790" cy="70" r="30" fill="none" stroke="#FF6B35" stroke-opacity="0.5"><animate attributeName="r" values="30;46;30" dur="2.4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.5;0;0.5" dur="2.4s" repeatCount="indefinite"/></circle><g transform="translate(776,56) scale(1.1667)" fill="none" stroke="#0D0D0F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" x2="12" y1="19" y2="22"></line></g><rect x="852" y="44.5" width="6" height="50.9" rx="3" fill="#2EC4B6" fill-opacity="1.01"><animate attributeName="height" values="15.3;50.9;15.3" dur="1.15s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="y" values="62.4;44.5;62.4" dur="1.15s" begin="0.0s" repeatCount="indefinite"/></rect><rect x="862" y="37.1" width="6" height="65.9" rx="3" fill="#FF6B35" fill-opacity="1.16"><animate attributeName="height" values="19.8;65.9;19.8" dur="1.15s" begin="-0.137s