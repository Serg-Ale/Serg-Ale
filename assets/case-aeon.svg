<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 358" role="img" aria-label="WhatsApp automation base: Customers needed to sign up and book at any hour, from their phone, and the official WhatsApp API added cost. Self-host the Evolution API and use the phone number as login, with OTP verification. Validated with the team before building. Customers sign up and book 24h from their phone, access got easier and cost dropped versus Meta's official API. Corta-ai now reuses this base."><rect x="0.5" y="0.5" width="1199" height="357" rx="20" fill="#141417" stroke="#26262B"/><text x="44" y="52" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" fill="#FF6B35" letter-spacing="2">CASE 03</text><text x="44" y="94" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="36" font-weight="800" fill="#EDEDED">WhatsApp automation base</text><text x="44" y="122" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#8A8A8A">Aeon Tech · built as a junior developer</text><rect x="1069" y="36" width="87" height="30" rx="15" fill="none" stroke="#2EC4B6"/><text x="1113" y="56" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" fill="#2EC4B6" letter-spacing="1">SHIPPED</text><rect x="44" y="136" width="22" height="3" rx="1.5" fill="#FF6B35"/><text x="44" y="164" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" fill="#FF6B35" letter-spacing="2">PROBLEM</text><text x="44" y="198" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8A8A8A">Customers needed to sign up and</text><text x="44" y="225" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8A8A8A">book at any hour, from their phone,</text><text x="44" y="252" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8A8A8A">and the official WhatsApp API added</text><text x="44" y="279" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8A8A8A">cost.</text><line x1="409" y1="142" x2="409" y2="266" stroke="#26262B"/><rect x="427" y="136" width="22" height="3" rx="1.5" fill="#FF6B35"/><text x="427" y="164" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" fill="#FF6B35" letter-spacing="2">DECISION</text><text x="427" y="198" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#EDEDED">Self-host the Evolution API and use</text><text x="427" y="225" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#EDEDED">the phone number as login, with OTP</text><text x="427" y="252" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#EDEDED">verification. Validated with the</text><text x="427" y="279" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#EDEDED">team before building.</text><line x1="791" y1="142" x2="791" y2="266" stroke="#26262B"/><rect x="809" y="136" width="22" height="3" rx="1.5" fill="#2EC4B6"/><text x="809" y="164" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" fill="#2EC4B6" letter-spacing="2">RESULT</text><text x="809" y="198" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8A8A8A">Customers sign up and book 24h from</text><text x="809" y="225" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8A8A8A">their phone, access got easier and</text><text x="809" y="252" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8A8A8A">cost dropped versus Meta's official</text><text x="809" y="279" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8A8A8A">API. Corta-ai now reuses this base.</text><rect x="44" y="300" width="131" height="28" rx="14" fill="#141417" stroke="#26262B"/><text x="110" y="318" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="14" fill="#EDEDED">Evolution API</text><rect x="183" y="300" width="47" height="28" rx="14" fill="#141417" stroke="#26262B"/><text x="207" y="318" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="14" fill="#EDEDED">OTP</text><rect x="238" y="300" width="81" height="28" rx="14" fill="#141417" stroke="#26262B"/><text x="279" y="318" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="14" fill="#EDEDED">Next.js</text><rect x="327" y="300" width="106" height="28" rx="14" fill="#141417" stroke="#26262B"/><text x="380" y="318" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="14" fill="#EDEDED">TypeScript</text></svg>