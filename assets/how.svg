<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 363" role="img" aria-label="How I work: spec first, AI executes, I own the mental model"><rect x="0.5" y="0.5" width="1199" height="362" rx="20" fill="#141417" stroke="#26262B"/><text x="44" y="62" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#EDEDED">Spec first. AI executes. <tspan fill="#FF6B35">I own the model.</tspan></text><text x="44" y="94" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#8A8A8A">Spec-driven development, not prompt engineering: the clearer I am about what I want, the better the AI gets at it.</text><text x="44" y="146" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" fill="#FF6B35" letter-spacing="2">01</text><text x="44" y="176" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#EDEDED">Align on the whole</text><text x="44" y="208" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8A8A8A">Questions before code: what are we</text><text x="44" y="235" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8A8A8A">solving, for whom, at what cost? A</text><text x="44" y="262" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8A8A8A">shared picture with the team before</text><text x="44" y="289" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8A8A8A">the first line.</text><text x="427" y="146" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" fill="#FF6B35" letter-spacing="2">02</text><text x="427" y="176" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#EDEDED">AI executes, I direct</text><text x="427" y="208" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8A8A8A">AI researches, drafts and surfaces</text><text x="427" y="235" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8A8A8A">failure modes faster than I can. It</text><text x="427" y="262" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8A8A8A">has limits and bias, so I keep the</text><text x="427" y="289" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8A8A8A">mental model and check what it</text><text x="427" y="316" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8A8A8A">misses.</text><text x="809" y="146" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" fill="#2EC4B6" letter-spacing="2">03</text><text x="809" y="176" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#EDEDED">Prove it in the open</text><text x="809" y="208" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8A8A8A">Spec, tickets, tests, review. The</text><text x="809" y="235" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8A8A8A">matrix-rain repo shows it: spec</text><text x="809" y="262" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8A8A8A">#14, tickets #15 to #22, 15 merged</text><text x="809" y="289" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8A8A8A">PRs and unit tests.</text></svg>