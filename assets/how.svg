.8" y2="227" stroke="#26262B" stroke-width="2"/><circle cx="155.2" cy="227" r="34" fill="#FF6B35" opacity="0"><animate attributeName="opacity" values="0;0;0.16;0.16;0;0" keyTimes="0;0.000;0.030;0.170;0.200;1" dur="10s" repeatCount="indefinite"/></circle><circle cx="155.2" cy="227" r="22" fill="#0D0D0F" stroke="#FF6B35" stroke-width="2"/><g transform="translate(145.2,217) scale(0.8333)" fill="none" stroke="#FF6B35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></g><text x="155.2" y="277" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="14" font-weight="700" text-anchor="middle" fill="#EDEDED">/grill-me</text><text x="155.2" y="299" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#8A8A8A">Grill the plan</text><circle cx="377.6" cy="227" r="34" fill="#FF6B35" opacity="0"><animate attributeName="opacity" values="0;0;0.16;0.16;0;0" keyTimes="0;0.200;0.230;0.370;0.400;1" dur="10s" repeatCount="indefinite"/></circle><circle cx="377.6" cy="227" r="22" fill="#0D0D0F" stroke="#FF6B35" stroke-width="2"/><g transform="translate(367.6,217) scale(0.8333)" fill="none" stroke="#FF6B35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="M10 9H8"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></g><text x="377.6" y="277" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="14" font-weight="700" text-anchor="middle" fill="#EDEDED">/to-spec</text><text x="377.6" y="299" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#8A8A8A">Write the spec</text><circle cx="600.0" cy="227" r="34" fill="#FF6B35" opacity="0"><animate attributeName="opacity" values="0;0;0.16;0.16;0;0" keyTimes="0;0.400;0.430;0.570;0.600;1" dur="10s" repeatCount="indefinite"/></circle><circle cx="600.0" cy="227" r="22" fill="#0D0D0F" stroke="#FF6B35" stroke-width="2"/><g transform="translate(590.0,217) scale(0.8333)" fill="none" stroke="#FF6B35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path><path d="M13 6h8"></path><path d="M13 12h8"></path><path d="M13 18h8"></path></g><text x="600.0" y="277" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="14" font-weight="700" text-anchor="middle" fill="#EDEDED">/to-tickets</text><text x="600.0" y="299" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#8A8A8A">Cut the tickets</text><circle cx="822.4" cy="227" r="34" fill="#FF6B35" opacity="0"><animate attributeName="opacity" values="0;0;0.16;0.16;0;0" keyTimes="0;0.600;0.630;0.770;0.800;1" dur="10s" repeatCount="indefinite"/></circle><circle cx="822.4" cy="227" r="22" fill="#0D0D0F" stroke="#FF6B35" stroke-width="2"/><g transform="translate(812.4,217) scale(0.8333)" fill="none" stroke="#FF6B35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"></path><path d="M8.5 2h7"></path><path d="M7 16h10"></path></g><text x="822.4" y="277" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="14" font-weight="700" text-anchor="middle" fill="#EDEDED">/tdd</text><text x="822.4" y="299" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#8A8A8A">Test first</text><circle cx="1044.8" cy="227" r="34" fill="#FF6B35" opacity="0"><animate attributeName="opacity" values="0;0;0.16;0.16;0;0" keyTimes="0;0.800;0.830;0.970;1.000;1" dur="10s" repeatCount="indefinite"/></circle><circle cx="1044.8" cy="227" r="22" fill="#0D0D0F" stroke="#FF6B35" stroke-width="2"/><g transform="translate(1034.8,217) scale(0.8333)" fill="none" stroke="#FF6B35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></g><text x="1044.8" y="277" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="14" font-weight="700" text-anchor="middle" fill="#EDEDED">/code-review</text><text x="1044.8" y="299" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#8A8A8A">Review in a clean</text><text x="1044.8" y="318" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#8A8A8A">context</text><line x1="44" y1="365" x2="1156" y2="365" stroke="#26262B" stroke-width="1"/><text x="44.0" y="403" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#FF6B35">01</text><text x="44.0" y="431" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#EDEDED">Align on the whole</text><text x="44.0" y="463" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">I ask before I code. The</text><text x="44.0" y="486" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">team and the PO share one</text><text x="44.0" y="509" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">vision before the first</text><text x="44.0" y="532" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">ticket.</text><text x="322.0" y="403" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#FF6B35">02</text><text x="322.0" y="431" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#EDEDED">AI executes, I direct</text><text x="322.0" y="463" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">It researches and executes</text><text x="322.0" y="486" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">faster than I do, and flags</text><text x="322.0" y="509" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">risks early. It has bias, so</text><text x="322.0" y="532" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">the mental model and the</text><text x="322.0" y="555" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">questions stay mine.</text><text x="600.0" y="403" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#2EC4B6">03</text><text x="600.0" y="431" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#EDEDED">Prove it in the open</text><text x="600.0" y="463" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">Spec, tickets, TDD and</text><text x="600.0" y="486" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">review in a public</text><text x="600.0" y="509" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">repository, so anyone can</text><text x="600.0" y="532" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">check.</text><text x="878.0" y="403" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#2EC4B6">04</text><text x="878.0" y="431" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#EDEDED">Speak up when something</text><text x="878.0" y="457" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#EDEDED">is off</text><text x="878.0" y="489" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">In payments and I see an</text><text x="878.0" y="512" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">auth problem elsewhere? I</text><text x="878.0" y="535" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">say so, and since code is</text><text x="878.0" y="558" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">cheap now, I fix it or write</text><text x="878.0" y="581" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">it up right then.</text></svg>
