<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 372" role="img" aria-label="The meetings system: two rings capture a call or a video; Huginn transcribes, tells who spoke, cuts chapters and summarizes; memoria searches everything by meaning and Muninn remembers what I promised."><rect x="0.5" y="0.5" width="1199" height="371" rx="20" fill="#141417" stroke="#26262B"/><text x="30" y="34" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" letter-spacing="3" fill="#8A8A8A">CAPTURE</text><rect x="30" y="62.0" width="300" height="130" rx="14" fill="#0D0D0F" stroke="#26262B"/><rect x="46" y="62.0" width="268" height="3" rx="1.5" fill="#FF6B35"/><text x="50" y="100.0" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#EDEDED">Meeting ring</text><text x="50" y="128.0" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8A8A8A">Floats over any app, records the</text><text x="50" y="148.0" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8A8A8A">call and shows a live chat.</text><text x="50" y="176.0" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" fill="#FF6B35">Qt · layer-shell · whisper</text><rect x="30" y="214.0" width="300" height="130" rx="14" fill="#0D0D0F" stroke="#26262B"/><rect x="46" y="214.0" width="268" height="3" rx="1.5" fill="#FF6B35"/><text x="50" y="252.0" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#EDEDED">Watch ring</text><text x="50" y="280.0" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8A8A8A">Watches a video with me: scenes,</text><text x="50" y="300.0" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8A8A8A">my comments and hooks.</text><text x="50" y="328.0" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" fill="#FF6B35">Qt · layer-shell · whisper</text><text x="450" y="34" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" letter-spacing="3" fill="#8A8A8A">UNDERSTAND</text><rect x="450" y="108.0" width="300" height="190" rx="14" fill="#0D0D0F" stroke="#26262B"/><rect x="466" y="108.0" width="268" height="3" rx="1.5" fill="#2EC4B6"/><text x="470" y="146.0" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#EDEDED">Huginn</text><text x="470" y="174.0" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8A8A8A">Transcribes, tells who spoke,</text><text x="470" y="194.0" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8A8A8A">cuts chapters and summarizes,</text><text x="470" y="214.0" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8A8A8A">with every quote checked against</text><text x="470" y="234.0" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8A8A8A">the transcript.</text><text x="470" y="282.0" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" fill="#2EC4B6">whisper.cpp · pyannote · Ollama</text><text x="870" y="34" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" letter-spacing="3" fill="#8A8A8A">REMEMBER</text><rect x="870" y="62.0" width="300" height="130" rx="14" fill="#0D0D0F" stroke="#26262B"/><rect x="886" y="62.0" width="268" height="3" rx="1.5" fill="#FF6B35"/><text x="890" y="100.0" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#EDEDED">memoria</text><text x="890" y="128.0" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8A8A8A">Searches every meeting and note</text><text x="890" y="148.0" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8A8A8A">by meaning.</text><text x="890" y="176.0" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" fill="#FF6B35">bge-m3 · SQLite · MCP</text><rect x="870" y="214.0" width="300" height="130" rx="14" fill="#0D0D0F" stroke="#26262B"/><rect x="886" y="214.0" width="268" height="3" rx="1.5" fill="#FF6B35"/><text x="890" y="252.0" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#EDEDED">Muninn</text><text x="890" y="280.0" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8A8A8A">Remembers what I promised and</text><text x="890" y="300.0" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8A8A8A">shows one thing at a time.</text><text x="890" y="328.0" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" fill="#FF6B35">Postgres · Redis · Next.js · MCP</text><path d="M336 127.0 C386 127.0 394 203.0 442 203.0" fill="none" stroke="#26262B" stroke-width="2"/><path d="M336 279.0 C386 279.0 394 203.0 442 203.0" fill="none" stroke="#26262B" stroke-width="2"/><polygon points="442,198.0 450,203.0 442,208.0" fill="#8A8A8A"/><path d="M756 203.0 C806 203.0 814 127.0 862 127.0" fill="none" stroke="#26262B" stroke-width="2"/><path d="M756 203.0 C806 203.0 814 279.0 862 279.0" fill="none" stroke="#26262B" stroke-width="2"/><polygon points="862,122.0 870,127.0 862,132.0" fill="#8A8A8A"/><polygon points="862,274.0 870,279.0 862,284.0" fill="#8A8A8A"/></svg>
