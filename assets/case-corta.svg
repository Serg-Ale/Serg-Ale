<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 444" role="img" aria-label="Corta-ai: A barbershop runs its schedule, billing and analytics in one product, and its clients book by chat. I proposed it, checked it with the team and the PO, and built it on the automation base I designed as a Jr. I worked across the web admin and the API, including roles, billing and analytics. The chat is one more way in. Login by OTP, with roles per barbershop. Owners and barbers manage schedule, services and cancellations. Analytics depend on the plan. Two barbershops are testing it. Billing runs daily: Pix, trial, grace period, and a block when payment is late. In the chat, fixed flows handle the common commands and an LLM handles the rest, on a self-hosted Evolution API."><rect x="0.5" y="0.5" width="1199" height="443" rx="20" fill="#141417" stroke="#26262B"/><text x="44" y="52" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" fill="#FF6B35" letter-spacing="2">CASE 01</text><text x="44" y="94" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="36" font-weight="800" fill="#EDEDED">Corta-ai</text><text x="44" y="122" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#8A8A8A">A barbershop runs its schedule, billing and analytics in one product, and its clients book by chat.</text><rect x="1069" y="36" width="87" height="30" rx="15" fill="none" stroke="#2EC4B6"/><text x="1113" y="56" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" fill="#2EC4B6" letter-spacing="1">IN PILOT</text><rect x="44" y="136" width="22" height="3" rx="1.5" fill="#FF6B35"/><text x="44" y="164" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" fill="#FF6B35" letter-spacing="2">DECISION</text><text x="44" y="198" font-family="-apple-system,'Segoe UI',Helvetica,Arial,san