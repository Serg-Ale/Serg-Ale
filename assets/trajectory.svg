system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">Production support for a</text><text x="480" y="262" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">large retail chain's</text><text x="480" y="284" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">overnight systems, and</text><text x="480" y="306" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">the technical link in</text><text x="480" y="328" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">incident war rooms.</text><circle cx="728" cy="114" r="8" fill="#0D0D0F" stroke="#FF6B35" stroke-width="3"/><text x="720" y="156" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="14" letter-spacing="2" fill="#FF6B35">2024</text><text x="720" y="188" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#EDEDED">Aeon Tech</text><text x="720" y="216" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" letter-spacing="2" fill="#FF6B35">JR</text><text x="720" y="240" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">Rebuilt the product with</text><text x="720" y="262" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">a team of four to five.</text><text x="720" y="284" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">Front end, auth and the</text><text x="720" y="306" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">landing page, plus a</text><text x="720" y="328" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8A8A8A">self-hosted WhatsApp</text><text x=